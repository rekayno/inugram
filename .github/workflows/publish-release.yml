name: publish-release

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: 'build.yml run id (empty = latest successful build on main)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: resolve build run
        id: run
        shell: bash
        env:
          INPUT_RUN_ID: ${{ inputs.run-id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          id="${INPUT_RUN_ID:-${EVENT_RUN_ID:-}}"
          if [ -z "$id" ]; then
            id=$(gh run list \
              --workflow build.yml \
              --branch main \
              --limit 30 \
              --json databaseId,conclusion,event \
              --jq '[.[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))][0].databaseId // ""')
          fi

          if [ -z "$id" ]; then
            echo "::error::no successful build.yml run found on main"
            exit 1
          fi

          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Using build run $id"

      - name: download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*'
          path: out
          merge-multiple: true
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f out/build-info.json || { echo "::error::build-info.json missing"; ls -la out; exit 1; }
          compgen -G 'out/*.apk' > /dev/null || { echo "::error::no APKs in artifacts"; ls -la out; exit 1; }
          ls -lh out

      - name: set up java (optional signing)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: set up android build-tools (optional signing)
        if: env.KEYSTORE_BASE64 != ''
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0

      - name: re-sign with custom keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in out/*.apk; do
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "${KEY_ALIAS:-inugram}" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --in "$apk" \
              --out "$apk.signed"
            "$apksigner" verify --print-certs "$apk.signed"
            mv "$apk.signed" "$apk"
          done

          rm -f "$RUNNER_TEMP/release.keystore"

      - name: create or update release
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail

          ver_name=$(jq -r .verName out/build-info.json)
          sha=$(jq -r .commitSha out/build-info.json)
          tag="v${ver_name}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            sign_note='signed with the keystore from the repository secrets'
          else
            sign_note='signed with Telegram public test key'
          fi

          notes=$(printf 'Automated build of %s.\n\n- Commit: %s\n- Build run: %s\n- APK: %s.\n' "$GITHUB_REPOSITORY" "$sha" "$run_url" "$sign_note")

          if gh release view "$tag" >/dev/null 2>&1; then
            target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            if [ "$target" != "$sha" ] && [ "$target" != "main" ]; then
              echo "::error::release $tag points at $target, expected $sha"
              exit 1
            fi
            gh release upload "$tag" out/*.apk out/build-info.json --clobber
            gh release edit "$tag" --notes "$notes" --draft=false
          else
            gh release create "$tag" \
              --target "$sha" \
              --title "$tag" \
              --notes "$notes" \
              out/*.apk out/build-info.json
          fi
